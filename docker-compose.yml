x-app-env: &app-env
  SECRET_KEY: ${SECRET_KEY:-change-me}
  DEBUG: ${DEBUG:-False}
  ALLOWED_HOSTS: localhost,127.0.0.1,web
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/assetsvc
  CELERY_BROKER_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: assetsvc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assetsvc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: celery -A config worker -l info
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    # Schedule state goes to /tmp so beat never needs write access to the app dir.
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
